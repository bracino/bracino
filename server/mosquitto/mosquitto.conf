# Mosquitto — Bracino broker (phase 1).
#
# Paths assume the apt-native broker (current bench: mosquitto installed
# on the dev VM, no docker yet). When this graduates into the compose
# stack, the container mount needs its own path variant
# (/mosquitto/data, log to stdout) — do it then, not now.
#
# SECURITY NOTE: allow_anonymous is a BENCH-ONLY decision (LAN-isolated
# dev VM). Tighten (password_file / listener binding) before this config
# faces anything beyond the bench LAN.
listener 1883 0.0.0.0
allow_anonymous true

# DN004 requirement: retained statuses must survive broker restarts.
persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
