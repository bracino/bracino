# Mosquitto — Bracino broker (phase 1, t520 deployment).
#
# Runs in the eclipse-mosquitto:2 container. The container's config dir
# is mounted from repo: server/mosquitto/mosquitto.conf + passwd (the
# passwd file is generated on the host with mosquitto_passwd — see
# server/README.md — and is gitignored; it never lands in git).
#
# SECURITY: single shared MQTT user "bracino" (DN004 decision 2026-09-05);
# devices are few, all inside one LAN, topics already partition by
# bracino/#. Per-user ACLs are the upgrade path if we ever need per-device
# revocation. Plaintext 1883 on the LAN is proportionate; TLS buys nothing
# against our threat model.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# DN004 requirement: retained statuses must survive broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
