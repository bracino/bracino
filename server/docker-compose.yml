# Bracino phase-1 stack — t520 backend (issue 015, stage A).
#
# Storage layout (2026-09-05 design, see server/README.md):
#   t520 local drive  : live JSONL  (ack path depends on nothing external)
#   /mnt/nas-data2    : JSONL mirror (daily rsync, crontab line in README)
#   /mnt/nas-data1    : InfluxDB (stage C; profile "influx", off by default)
#
# Start:  docker compose up -d          (mosquitto + commit)
# Stage C: docker compose --profile influx up -d
#
# Secrets: server/.env (gitignored) holds MQTT_USER / MQTT_PASS; the
# hashed broker passwd file is generated on the host (see README).

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bracino-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - /mnt/nas-data1/bracino/mosquitto/data:/mosquitto/data
      - /mnt/nas-data1/bracino/mosquitto/log:/mosquitto/log

  commit:
    build: ./commit-service
    image: bracino/commit-service:015
    container_name: bracino-commit
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
    volumes:
      - /var/lib/bracino/commit:/app/data

  # Stage C — off by default. Token lands in .env (INFLUX_TOKEN).
  influxdb:
    profiles: ["influx"]
    image: influxdb:2.7
    container_name: bracino-influx
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      INFLUXD_REPORTING_DISABLED: "true"
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: bracino
      DOCKER_INFLUXDB_INIT_BUCKET: bracino
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - /mnt/nas-data1/bracino/influx/data:/var/lib/influxdb2
      - /mnt/nas-data1/bracino/influx/config:/etc/influxdb2
